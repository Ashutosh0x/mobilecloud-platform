name: MobileCloud CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust kernel + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Automated Test Harness Matrix (testing doc section 7):
      #   por-kernel:   100% unit pass, zero overflows across 10k cases
      #   por-verifier: 100% pass incl. the chaos suite (duplicate signer,
      #                 replay, sybil, forged signature)
      - name: por-kernel tests (10,000 edge cases)
        run: cargo test -p por-kernel --release
      - name: por-verifier contract tests (chaos suite)
        run: cargo test -p por-verifier --release
      - name: core-engine tests
        run: cargo test -p core-engine --release
      - name: trading-engine tests
        run: cargo test -p trading-engine --release
      - name: Build Soroban WASM
        run: cargo build -p por-verifier --target wasm32-unknown-unknown --release

  web-cloudshell:
    name: Web CloudShell typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web-cloudshell
      - run: npm run build
        working-directory: web-cloudshell

  android:
    name: Android release build + multi-scheme sign
    runs-on: ubuntu-latest
    needs: rust
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            ndk;27.1.12297006
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk

      # Rust por-kernel .so with 16 KB page alignment (build manual section 4).
      - name: Cross-Compile libpor_kernel.so (16 KB aligned)
        working-directory: por-kernel
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo ndk -t arm64-v8a -o ../android-app/app/src/main/jniLibs build --release

      - name: Decode Release Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > mobilecloud-release.jks

      - name: Build Release APK via Gradle
        working-directory: android-app
        env:
          KEYSTORE_PATH: ../../mobilecloud-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          gradle assembleRelease --stacktrace

      - name: 16 KB Page Align APK with zipalign
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -P 16 -v 4 \
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk \
            mobilecloud-release-aligned.apk

      - name: Sign APK with apksigner (v1, v2, v3, v4)
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mobilecloud-release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out mobilecloud-release-signed.apk \
            mobilecloud-release-aligned.apk

      - name: Verify Signed APK Signatures
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs mobilecloud-release-signed.apk

      - name: Upload Production Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobilecloud-release-apk
          path: |
            mobilecloud-release-signed.apk
            mobilecloud-release-signed.apk.idsig
