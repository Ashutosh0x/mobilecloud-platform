name: MobileCloud CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust kernel + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Automated Test Harness Matrix (testing doc section 7):
      #   por-kernel:   100% unit pass, zero overflows across 10k cases
      #   por-verifier: 100% pass incl. the chaos suite (duplicate signer,
      #                 replay, sybil, forged signature)
      - name: por-kernel tests (10,000 edge cases)
        run: cargo test -p por-kernel --release
      - name: por-verifier contract tests (chaos suite)
        run: cargo test -p por-verifier --release
      - name: core-engine tests
        run: cargo test -p core-engine --release
      - name: trading-engine tests
        run: cargo test -p trading-engine --release
      - name: Build Soroban WASM
        run: cargo build -p por-verifier --target wasm32-unknown-unknown --release

  web-cloudshell:
    name: Web CloudShell typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web-cloudshell
      - run: npm run build
        working-directory: web-cloudshell

  web-dashboard:
    name: Next.js Web Console tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: apps/web-dashboard
      - name: Run Web Console tests
        working-directory: apps/web-dashboard
        run: npm test
      - run: npm run build
        working-directory: apps/web-dashboard

  android-debug:
    name: Android debug compile and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Compile and lint debug
        working-directory: android-app
        run: bash ./gradlew --no-daemon :app:compileDebugKotlin :app:lintDebug

  android:
    name: Android verified release APK
    runs-on: ubuntu-latest
    needs: [rust, android-debug, web-dashboard]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - name: Build, sign and verify console APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          OUT_DIR: ${{ runner.temp }}/mobilecloud-release
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Release keystore not configured}"
          keystore="$(mktemp "$RUNNER_TEMP/mobilecloud-keystore.XXXXXXXX")"
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          KEYSTORE_PATH="$keystore" bash scripts/build-and-sign-apk.sh
      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobilecloud-release-apk
          path: ${{ runner.temp }}/mobilecloud-release/mobilecloud-release-signed.apk
          if-no-files-found: error

  docs-integrity:
    name: Status and integrity checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Feature status is generated, not hand-edited
        run: node scripts/render-feature-status.mjs --check
      - name: Integrity manifest matches tracked files
        run: node scripts/integrity-manifest.mjs
