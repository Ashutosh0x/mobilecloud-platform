# Deployment-only tunnel. Operator APIs and terminal must stay off the tunnel.
tunnel: mobilecloud-edge-01
credentials-file: /var/mobilecloud/state/cloudflared/tunnel.json
origincert: /var/mobilecloud/state/cloudflared/cert.pem

protocol: quic
edge-ip-version: "4"
retries: 5
grace-period: 30s
udp-payload-size: 1400

ingress:
  # Must precede the wildcard: the former CloudShell host has no public origin.
  - hostname: admin.phone.mobilecloud.live
    service: http_status:404

  # The engine serves only explicitly configured exact deployment hosts.
  - hostname: "*.phone.mobilecloud.live"
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 5s
      keepAliveConnections: 16

  - hostname: store.mydomain.com
    service: http://127.0.0.1:8080

  - service: http_status:404
