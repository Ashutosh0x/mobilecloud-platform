<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MobileCloud CloudShell</title>
  <!-- CIDS baseline (terminal doc §6.2 theme) -->
  <style>
    html, body { margin: 0; height: 100%; background-color: #070A13; }
    body { font-family: 'JetBrains Mono', Menlo, monospace; overflow: hidden; }
    #terminal-container { width: 100vw; height: 100vh; padding: 12px; box-sizing: border-box; }
    #status-pill {
      position: fixed; top: 10px; right: 14px; z-index: 10;
      font-size: 11px; letter-spacing: 0.06em; padding: 3px 10px;
      border-radius: 999px; background: rgba(30, 41, 59, 0.85); color: #94A3B8;
      border: 1px solid #1E293B; user-select: none;
    }
    #status-pill[data-status="open"] { color: #10B981; }
    #status-pill[data-status="reconnecting"],
    #status-pill[data-status="connecting"] { color: #F59E0B; }
    #status-pill[data-status="closed"] { color: #EF4444; }
  </style>
</head>
<body>
  <div id="terminal-container"></div>
  <div id="status-pill" data-status="connecting">CLOUDSHELL</div>

  <script type="module">
    import { mountTerminal } from '/src/terminal.ts';
    const pill = document.getElementById('status-pill');
    const handle = mountTerminal(
      document.getElementById('terminal-container'),
      (status) => { pill.dataset.status = status; pill.textContent = status.toUpperCase(); },
    );
    window.addEventListener('beforeunload', () => handle.dispose());
  </script>
</body>
</html>
