[workspace]
resolver = "2"
members = [
    "core-engine",
    "por-kernel",
    "trading-engine",
    "contracts/por-verifier",
    "tools/por-attestor",
    "tools/por-submitter",
]

# The contracts crate compiles to `wasm32-unknown-unknown` for Stellar Soroban
# and is excluded from the default host build/test target when the Soroban SDK
# is not desired on the host toolchain. It stays a workspace member so that
# `cargo build -p por-verifier --target wasm32-unknown-unknown` works directly.
default-members = ["core-engine", "por-kernel", "trading-engine", "tools/por-attestor", "tools/por-submitter"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mobilecloud/mobilecloud-platform"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
