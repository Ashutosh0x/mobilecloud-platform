[package]
name = "core-engine"
description = "MobileCloud native supervisor daemon: Vercel Build Output API v3 router, on-device Bun/Turbopack builder with atomic symlink promotion, and the tri-modal terminal gateway (PTY + WebSocket + SSH)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mobilecloud-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
regex = "1"
git2 = "0.19"
portable-pty = "0.8"
brotli = "7"
zstd = "0.13"
flate2 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
russh = "0.45"
russh-keys = "0.45"
ssh-key = "0.6"
ed25519-dalek = "2"
async-trait = "0.1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
